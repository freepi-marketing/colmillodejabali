<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Reportes mensuales de desempeño en redes sociales de Colmillo de Jabalí.">
<meta name="robots" content="noindex, nofollow">
<title>Reportes · Colmillo de Jabalí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EDEDE2;--card:#fff;--deep:#1C3A2E;--deep2:#14291F;--ink:#171A18;--soft:#5C6B62;--faint:#8E9A93;
  --gold:#F4B831;--goldink:#8F6608;--hair:#E2E2D2;--shadow:0 1px 2px rgba(28,58,46,.05),0 8px 24px -12px rgba(28,58,46,.16)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A14;--card:#18291F;--deep:#0A150F;--deep2:#060E0A;
  --ink:#F1F0DC;--soft:#A5BAAC;--faint:#748C7D;--goldink:#F4B831;--hair:#24382C;--shadow:0 10px 28px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0E1A14;--card:#18291F;--deep:#0A150F;--deep2:#060E0A;
  --ink:#F1F0DC;--soft:#A5BAAC;--faint:#748C7D;--goldink:#F4B831;--hair:#24382C;--shadow:0 10px 28px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Work Sans",-apple-system,sans-serif;font-size:15px;line-height:1.55}
.page{max-width:760px;margin:0 auto;padding:64px 24px 80px}
.kick{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--goldink);margin:0 0 10px}
h1{font-family:"Noto Serif",Georgia,serif;font-weight:700;font-size:clamp(30px,5vw,42px);line-height:1.08;margin:0 0 10px;letter-spacing:-.02em}
.sub{color:var(--soft);margin:0 0 40px}
.list{display:grid;gap:14px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between;
  background:var(--card);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.item:hover,.item:focus-visible{transform:translateY(-2px);outline:none}
.item:focus-visible{box-shadow:0 0 0 3px var(--gold)}
@media(prefers-reduced-motion:no-preference){.item{transition:transform .18s ease}}
.item .mes{font-family:"Noto Serif",Georgia,serif;font-weight:600;font-size:20px;margin:0}
.item .det{font-size:13px;color:var(--faint);margin:3px 0 0}
.go{font-size:13px;font-weight:600;color:var(--goldink)}
footer{margin-top:48px;font-size:12.5px;color:var(--faint)}
footer .sl{font-family:"Noto Serif",Georgia,serif;font-style:italic;color:var(--goldink);margin-top:5px}
</style>
</head>
<body>
<div class="page">
  <p class="kick">Colmillo de Jabalí</p>
  <h1>Reportes de desempeño</h1>
  <p class="sub">Instagram y TikTok. Se publica el día 1 de cada mes con el mes anterior completo.</p>
  <div class="list">
    <a class="item" href="2026-08.html">
      <div><p class="mes">Agosto 2026</p><p class="det">Primer mes de operación · 28 publicaciones · 4,150 reproducciones</p></div>
      <span class="go">Abrir →</span>
    </a>
  </div>
  <footer>
    <div>Actualizado cada mes</div>
    <div class="sl">El fuego, la tradición y el detalle.</div>
  </footer>
</div>
</body>
</html>
